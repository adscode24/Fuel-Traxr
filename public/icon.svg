<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Subtle inner background highlight -->
  <circle cx="256" cy="180" r="140" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Foreground Group with shadow -->
  <g filter="url(#glow)">
    <!-- Odometer / Speedometer Arc in upper area -->
    <path d="M 140 230 A 130 130 0 0 1 372 230" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="16" stroke-linecap="round"/>
    <path d="M 140 230 A 130 130 0 0 1 320 140" fill="none" stroke="url(#meterGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Fuel Pump Dispenser Body -->
    <rect x="180" y="210" width="115" height="175" rx="16" fill="#ffffff"/>

    <!-- Pump Digital Screen -->
    <rect x="195" y="232" width="85" height="52" rx="8" fill="#0f172a"/>
    <text x="237" y="264" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="1">BBM</text>

    <!-- Fuel Dispenser Hose & Nozzle -->
    <!-- Base connection -->
    <circle cx="295" cy="305" r="9" fill="#e2e8f0"/>
    <!-- Flexible Hose Curve -->
    <path d="M 295 305 C 345 315, 360 270, 345 220 C 340 205, 335 195, 320 190" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/>
    <!-- Nozzle Handle -->
    <path d="M 320 190 L 305 180 L 315 165 L 332 178 Z" fill="#f8fafc"/>
    <!-- Nozzle Spout -->
    <path d="M 315 165 L 300 150 L 290 155" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Fuel drop accent -->
    <path d="M 237 312 C 237 312, 222 332, 222 344 C 222 353, 229 360, 237 360 C 245 360, 252 353, 252 344 C 252 332, 237 312, 237 312 Z" fill="#2563eb"/>
  </g>
</svg>
